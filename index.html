<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDrop - 赛博朋克多端终端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace, sans-serif; background-color: #030712; color: #00ff66; overflow-x: hidden; }
        .glow-box { box-shadow: 0 0 20px rgba(0, 255, 102, 0.15); border: 1px solid rgba(0, 255, 102, 0.3); }
        .glow-box-blue { box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); border: 1px solid rgba(0, 210, 255, 0.4); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); }
        .glow-text-blue { text-shadow: 0 0 10px rgba(0, 210, 255, 0.6); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #00ff66; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 背景装饰网格 -->
    <div class="fixed inset-0 pointer-events-none opacity-10 bg-[linear-gradient(to_right,#00ff66_1px,transparent_1px),linear-gradient(to_bottom,#00ff66_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

    <!-- 自定义赛博朋克弹窗模态框 -->
    <div id="cyberModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="glow-box bg-neutral-950 p-6 rounded-2xl max-w-sm w-full mx-4 text-center space-y-4 border border-emerald-500/60">
            <div class="text-xs uppercase tracking-widest text-emerald-500" id="modalTitle">系统提示</div>
            <div id="modalMessage" class="text-emerald-300 text-sm leading-relaxed py-2">提示内容</div>
            <button onclick="closeCyberModal()" class="w-full bg-emerald-950 hover:bg-emerald-900 border border-emerald-500 text-emerald-300 font-bold py-2.5 rounded-lg transition glow-text tracking-widest text-xs">
                关闭窗口
            </button>
        </div>
    </div>

    <!-- 顶栏状态指示器 -->
    <header class="absolute top-4 left-4 right-4 flex justify-between items-center text-xs tracking-widest text-emerald-500/75 z-10">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>GOOGLE_DRIVE_CLOUD // SYNC</span>
        </div>
        <div id="userInfoDisplay" class="hidden flex items-center space-x-2">
            <span>[用户: <span id="currentQQDisplay" class="text-emerald-400"></span>]</span>
            <button onclick="logout()" class="bg-neutral-800 hover:bg-neutral-700 border border-emerald-500/40 text-emerald-300 px-2 py-1 rounded transition">登出</button>
            <button onclick="deleteAccount()" class="bg-red-950/80 hover:bg-red-900 border border-red-500/60 text-red-300 px-2 py-1 rounded transition">注销账户</button>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-md z-10">

        <!-- 1. 登录/注册/修改密码 视图区域 -->
        <div id="authView" class="glow-box bg-black/80 backdrop-blur-md p-8 rounded-2xl relative">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold tracking-wider glow-text text-emerald-400">CYBER_AUTH</h1>
                <p class="text-xs text-emerald-600 mt-2 tracking-widest">Google Drive 实时云端同步</p>
            </div>

            <!-- 登录表单 -->
            <div id="loginFormContainer" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">QQ 号 / 用户名</label>
                    <input type="text" id="loginQQ" placeholder="输入您的 QQ 号" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">主密码</label>
                    <input type="password" id="loginPass1" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleLogin()" id="loginBtn" class="w-full mt-2 bg-emerald-950 hover:bg-emerald-900 border border-emerald-500 text-emerald-400 font-bold py-3 rounded-lg transition duration-200 glow-text tracking-widest">
                    登 录 系 统
                </button>
            </div>

            <!-- 注册表单 -->
            <div id="registerFormContainer" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">QQ 号 / 用户名</label>
                    <input type="text" id="regQQ" placeholder="输入您的 QQ 号" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">设置密码</label>
                    <input type="password" id="regPass1" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">确认密码</label>
                    <input type="password" id="regPass2" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleRegister()" id="regBtn" class="w-full mt-2 bg-neutral-900 hover:bg-emerald-950 border border-emerald-500 text-emerald-400 font-bold py-3 rounded-lg transition duration-200 glow-text tracking-widest">
                    注册并存入 Google 表格
                </button>
            </div>

            <!-- 修改密码表单 -->
            <div id="resetFormContainer" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-cyan-500 mb-1">QQ 号 / 用户名</label>
                    <input type="text" id="resetQQ" placeholder="输入账号" class="w-full bg-neutral-900 border border-cyan-900 text-cyan-300 px-4 py-2.5 rounded-lg focus:outline-none focus:border-cyan-500 transition text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-amber-500 mb-1">原主密码 (验证身份)</label>
                    <input type="password" id="oldPass" placeholder="输入当前旧密码" class="w-full bg-neutral-900 border border-amber-900 text-amber-300 px-4 py-2.5 rounded-lg focus:outline-none focus:border-amber-500 transition text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-cyan-500 mb-1">设置新主密码</label>
                    <input type="password" id="resetPass1" placeholder="输入新密码" class="w-full bg-neutral-900 border border-cyan-900 text-cyan-300 px-4 py-2.5 rounded-lg focus:outline-none focus:border-cyan-500 transition text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-cyan-500 mb-1">确认新主密码</label>
                    <input type="password" id="resetPass2" placeholder="再次输入新密码" class="w-full bg-neutral-900 border border-cyan-900 text-cyan-300 px-4 py-2.5 rounded-lg focus:outline-none focus:border-cyan-500 transition text-sm">
                </div>
                <button onclick="handleChangePassword()" id="resetBtn" class="w-full mt-2 bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-300 font-bold py-3 rounded-lg transition duration-200 glow-text-blue tracking-widest text-xs">
                    核 对 旧 密 码 并 修 改
                </button>
            </div>

            <!-- 底部多重切换按钮 -->
            <div class="mt-6 flex justify-between text-xs pt-4 border-t border-emerald-950">
                <button id="toggleResetBtn" onclick="switchAuthMode('reset')" class="text-cyan-400 hover:text-cyan-200 font-semibold tracking-wider">
                    🔑 修改密码
                </button>
                <button id="toggleAuthModeBtn" onclick="switchAuthMode('toggle')" class="text-emerald-400 hover:text-emerald-200 font-semibold tracking-wider">
                    注册新账号 →
                </button>
            </div>
        </div>

        <!-- 2. 主功能菜单 -->
        <div id="mainMenuView" class="hidden glow-box bg-black/85 backdrop-blur-md p-8 rounded-2xl text-center space-y-4">
            <div>
                <h2 class="text-2xl font-bold glow-text text-emerald-400 tracking-wider">P2P 终端就绪</h2>
                <p class="text-xs text-emerald-600 mt-1">请选择您的操作模式</p>
            </div>
            <div class="grid grid-cols-1 gap-3 pt-2">
                <button onclick="switchView('sendView'); initSender();" class="p-3.5 rounded-xl border border-emerald-500/50 bg-emerald-950/20 hover:bg-emerald-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">📤</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-emerald-300 glow-text tracking-widest">传 送 文 件</div>
                        <div class="text-xs text-emerald-600">生成随机码发送 (支持.exe等)</div>
                    </div>
                </button>
                <button onclick="switchView('receiveView')" class="p-3.5 rounded-xl border border-cyan-500/50 bg-cyan-950/20 hover:bg-cyan-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">📥</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-cyan-300 glow-text-blue tracking-widest">接 收 文 件</div>
                        <div class="text-xs text-cyan-600">输入对方连接码接收</div>
                    </div>
                </button>
                <button onclick="goToChat()" class="p-3.5 rounded-xl border border-purple-500/50 bg-purple-950/20 hover:bg-purple-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">💬</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-purple-300 tracking-widest">进 入 聊 天 室</div>
                        <div class="text-xs text-purple-400">点对点实时加密文字通讯</div>
                    </div>
                </button>
                <button onclick="goToBoard()" class="p-3.5 rounded-xl border border-emerald-500/50 bg-emerald-950/20 hover:bg-emerald-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">📋</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-emerald-300 tracking-widest">机 密 留 言 板</div>
                        <div class="text-xs text-emerald-600">图文情报站 (同步至Google硬盘)</div>
                    </div>
                </button>
                <!-- 新增：鸽子大炮联机对战游戏入口 -->
                <button onclick="goToGame()" class="p-3.5 rounded-xl border border-amber-500/50 bg-amber-950/20 hover:bg-amber-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">🕊️</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-amber-300 tracking-widest">鸽子大炮对决战</div>
                        <div class="text-xs text-amber-500">双人房号联机塔防对战</div>
                    </div>
                </button>
                <!-- 管理员特权入口 (仅当账号为 admin 时显示) -->
                <button id="adminPortalBtn" onclick="goToAdmin()" class="hidden p-3.5 rounded-xl border border-red-500/50 bg-red-950/20 hover:bg-red-950/40 flex items-center justify-center space-x-4">
                    <span class="text-2xl">⚡</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-red-400 glow-text-red tracking-widest">至高管理员终端</div>
                        <div class="text-xs text-red-600">上帝视角：修改/删除/审判封号</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- 3. 传送文件子视图 -->
        <div id="sendView" class="hidden glow-box bg-black/85 backdrop-blur-md p-8 rounded-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-emerald-400 glow-text">传送端配置 (真实 P2P)</h3>
                <button onclick="switchView('mainMenuView')" class="text-xs text-emerald-600 hover:text-emerald-400 underline">← 返回主菜单</button>
            </div>
            <div class="space-y-4">
                <input type="file" id="fileInput" class="w-full text-xs text-emerald-400 border border-emerald-900 rounded-lg p-2 bg-neutral-900">
                <div class="text-center py-4 bg-neutral-900/60 rounded-xl border border-emerald-950">
                    <p class="text-xs text-emerald-500 mb-1">自动生成的 6 位随机连接码：</p>
                    <div id="roomCodeDisplay" class="text-3xl font-extrabold text-emerald-300 tracking-widest glow-text">初始化中...</div>
                </div>
                <div id="sendProgressContainer" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-emerald-500">
                        <span id="sendStatusText">等待连接...</span>
                        <span id="sendPercentage">0%</span>
                    </div>
                    <div class="w-full bg-neutral-900 rounded-full h-2 border border-emerald-950 overflow-hidden">
                        <div id="sendProgressBar" class="bg-emerald-400 h-full w-0"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. 接收文件子视图 -->
        <div id="receiveView" class="hidden glow-box-blue bg-black/85 backdrop-blur-md p-8 rounded-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-cyan-400 glow-text-blue">接收端配置 (真实 P2P)</h3>
                <button onclick="switchView('mainMenuView')" class="text-xs text-cyan-600 hover:text-cyan-400 underline">← 返回主菜单</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="inputRoomCode" maxlength="6" placeholder="输入 6 位连接码" class="w-full bg-neutral-900 border border-cyan-900 text-cyan-300 text-center text-xl tracking-widest px-4 py-3 rounded-lg focus:outline-none">
                <button onclick="connectAndReceive()" class="w-full bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-400 font-bold py-3 rounded-lg glow-text-blue">连 接 并 接 收</button>
                <div id="receiveProgressContainer" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-cyan-500">
                        <span id="receiveStatusText">正在连接...</span>
                        <span id="receivePercentage">0%</span>
                    </div>
                    <div class="w-full bg-neutral-900 rounded-full h-2 border border-cyan-950 overflow-hidden">
                        <div id="receiveProgressBar" class="bg-cyan-400 h-full w-0"></div>
                    </div>
                </div>
                <div id="downloadLinkContainer" class="hidden pt-2">
                    <button onclick="saveFileToFolder()" class="w-full bg-cyan-900 border border-cyan-400 text-cyan-200 font-bold py-3 rounded-lg">📂 另存为...</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2PFciwbWNzKqH6VPe8Yij7vGR4t6dsQRHSM31fbN4D9GCyWZjTRTAgDxe4sIec-fkeQ/exec";

        function showCyberAlert(msg, title = "系统提示") {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('cyberModal').classList.remove('hidden');
        }

        function closeCyberModal() {
            document.getElementById('cyberModal').classList.add('hidden');
        }

        function getUsersFromGoogle() {
            return new Promise((resolve) => {
                const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    resolve(data.
