<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDrop - P2P 真·文件互传终端 (云端多端同步版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            font-family: 'Share Tech Mono', monospace, sans-serif;
            background-color: #030712;
            color: #00ff66;
            overflow-x: hidden;
        }
        .glow-box {
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        .glow-box-blue {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.4);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
        }
        .glow-text-blue {
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff66;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 背景装饰网格 -->
    <div class="fixed inset-0 pointer-events-none opacity-10 bg-[linear-gradient(to_right,#00ff66_1px,transparent_1px),linear-gradient(to_bottom,#00ff66_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

    <!-- 顶栏状态指示器 -->
    <header class="absolute top-4 left-4 right-4 flex justify-between items-center text-xs tracking-widest text-emerald-500/75 z-10">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>P2P_PEER_NODE // CLOUD_SYNC V6.1</span>
        </div>
        <div id="userInfoDisplay" class="hidden flex items-center space-x-3">
            <span>[用户: <span id="currentQQDisplay" class="text-emerald-400"></span>]</span>
            <button onclick="logout()" class="bg-neutral-800 hover:bg-neutral-700 border border-emerald-500/40 text-emerald-300 px-2.5 py-1 rounded transition">登出</button>
            <button onclick="deleteAccount()" class="bg-red-950/80 hover:bg-red-900 border border-red-500 text-red-300 px-2.5 py-1 rounded transition">永久注销账户</button>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-md z-10">

        <!-- 1. 登录/注册 视图区域 -->
        <div id="authView" class="glow-box bg-black/80 backdrop-blur-md p-8 rounded-2xl relative">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-wider glow-text text-emerald-400">CYBER_AUTH</h1>
                <p class="text-xs text-emerald-600 mt-2 tracking-widest" id="authSubtitle">多端云端数据实时互通</p>
            </div>

            <!-- 登录表单 -->
            <div id="loginFormContainer" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">QQ 号 / 用户名</label>
                    <input type="text" id="loginQQ" placeholder="输入您的 QQ 号" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">主密码</label>
                    <input type="password" id="loginPass1" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleLogin()" class="w-full mt-2 bg-emerald-950 hover:bg-emerald-900 border border-emerald-500 text-emerald-400 font-bold py-3 rounded-lg transition duration-200 glow-text tracking-widest">
                    登 录 系 统
                </button>
            </div>

            <!-- 注册表单 -->
            <div id="registerFormContainer" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">QQ 号 / 用户名 (全局唯一)</label>
                    <input type="text" id="regQQ" placeholder="输入您的 QQ 号" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">设置密码</label>
                    <input type="password" id="regPass1" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-1">确认密码</label>
                    <input type="password" id="regPass2" placeholder="••••••••" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleRegister()" class="w-full mt-2 bg-neutral-900 hover:bg-emerald-950 border border-emerald-500 text-emerald-400 font-bold py-3 rounded-lg transition duration-200 glow-text tracking-widest">
                    确认注册并同步至云端
                </button>
            </div>

            <!-- 底部切换/管理区域 -->
            <div class="mt-6 flex justify-between items-center text-xs pt-4 border-t border-emerald-950">
                <button onclick="exportToExcel()" class="text-emerald-600 hover:text-emerald-400 underline transition">
                    📥 导出云注册表(Excel/CSV)
                </button>
                <button id="toggleAuthModeBtn" onclick="toggleAuthMode()" class="text-emerald-400 hover:text-emerald-200 font-semibold tracking-wider">
                    注册新账号 →
                </button>
            </div>
        </div>

        <!-- 2. 主功能菜单视图 -->
        <div id="mainMenuView" class="hidden glow-box bg-black/85 backdrop-blur-md p-8 rounded-2xl text-center space-y-6">
            <div>
                <h2 class="text-2xl font-bold glow-text text-emerald-400 tracking-wider">P2P 终端就绪</h2>
                <p class="text-xs text-emerald-600 mt-1">请选择您的操作模式</p>
            </div>

            <div class="grid grid-cols-1 gap-4 pt-2">
                <button onclick="switchView('sendView'); initSender();" class="group relative overflow-hidden p-5 rounded-xl border border-emerald-500/50 hover:border-emerald-400 bg-emerald-950/20 hover:bg-emerald-950/40 transition-all duration-300 flex items-center justify-center space-x-4">
                    <span class="text-2xl">📤</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-emerald-300 glow-text tracking-widest">传 送 文 件</div>
                        <div class="text-xs text-emerald-600">生成随机码发送 (支持.exe等)</div>
                    </div>
                </button>

                <button onclick="switchView('receiveView')" class="group relative overflow-hidden p-5 rounded-xl border border-cyan-500/50 hover:border-cyan-400 bg-cyan-950/20 hover:bg-cyan-950/40 transition-all duration-300 flex items-center justify-center space-x-4">
                    <span class="text-2xl">📥</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-cyan-300 glow-text-blue tracking-widest">接 收 文 件</div>
                        <div class="text-xs text-cyan-600">输入对方连接码接收</div>
                    </div>
                </button>

                <button onclick="goToChat()" class="group relative overflow-hidden p-5 rounded-xl border border-purple-500/50 hover:border-purple-400 bg-purple-950/20 hover:bg-purple-950/40 transition-all duration-300 flex items-center justify-center space-x-4">
                    <span class="text-2xl">💬</span>
                    <div class="text-left">
                        <div class="text-base font-bold text-purple-300 tracking-widest">进 入 聊 天 室</div>
                        <div class="text-xs text-purple-400">点对点实时加密文字通讯</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- 3. 传送文件子视图 -->
        <div id="sendView" class="hidden glow-box bg-black/85 backdrop-blur-md p-8 rounded-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-emerald-400 glow-text">传送端配置 (真实 P2P)</h3>
                <button onclick="switchView('mainMenuView')" class="text-xs text-emerald-600 hover:text-emerald-400 underline">← 返回主菜单</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-500 mb-2">选择要发送的文件 (.exe, 压缩包等)</label>
                    <input type="file" id="fileInput" class="w-full text-xs text-emerald-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-950 file:text-emerald-300 hover:file:bg-emerald-900 cursor-pointer border border-emerald-900 rounded-lg p-2 bg-neutral-900">
                </div>

                <div class="text-center py-4 bg-neutral-900/60 rounded-xl border border-emerald-950">
                    <p class="text-xs text-emerald-500 mb-1">自动生成的 6 位随机连接码：</p>
                    <div id="roomCodeDisplay" class="text-3xl font-extrabold text-emerald-300 tracking-widest glow-text">初始化中...</div>
                </div>

                <div id="sendProgressContainer" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-emerald-500">
                        <span id="sendStatusText">等待接收端连接...</span>
                        <span id="sendPercentage">0%</span>
                    </div>
                    <div class="w-full bg-neutral-900 rounded-full h-2 border border-emerald-950 overflow-hidden">
                        <div id="sendProgressBar" class="bg-emerald-400 h-full w-0 transition-all duration-150"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. 接收文件子视图 -->
        <div id="receiveView" class="hidden glow-box-blue bg-black/85 backdrop-blur-md p-8 rounded-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-cyan-400 glow-text-blue">接收端配置 (真实 P2P)</h3>
                <button onclick="switchView('mainMenuView')" class="text-xs text-cyan-600 hover:text-cyan-400 underline">← 返回主菜单</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-cyan-500 mb-2">输入发送方的 6 位连接码</label>
                    <input type="text" id="inputRoomCode" maxlength="6" placeholder="例如: 849201" class="w-full bg-neutral-900 border border-cyan-900 text-cyan-300 text-center text-xl tracking-widest px-4 py-3 rounded-lg focus:outline-none focus:border-cyan-500 uppercase transition">
                </div>

                <button onclick="connectAndReceive()" class="w-full bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-400 font-bold py-3 rounded-lg transition duration-200 glow-text-blue tracking-widest">
                    连 接 并 接 收
                </button>

                <div id="receiveProgressContainer" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-cyan-500">
                        <span id="receiveStatusText">正在连接...</span>
                        <span id="receivePercentage">0%</span>
                    </div>
                    <div class="w-full bg-neutral-900 rounded-full h-2 border border-cyan-950 overflow-hidden">
                        <div id="receiveProgressBar" class="bg-cyan-400 h-full w-0 transition-all duration-150"></div>
                    </div>
                </div>

                <div id="downloadLinkContainer" class="hidden space-y-3 pt-2">
                    <button onclick="saveFileToFolder()" class="w-full bg-cyan-900 hover:bg-cyan-800 border border-cyan-400 text-cyan-200 font-bold py-3 rounded-lg transition duration-200 glow-text-blue tracking-widest flex items-center justify-center space-x-2">
                        <span>📂 另存为... (自主选择保存文件夹)</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // 使用公开稳定的跨域公共存储 API (JsonBin 动态公开桶)，实现跨设备真正双向读写同步
        const BIN_ID = '65f08861dc74654018b14a22';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        async function getUsers() {
            try {
                // 强制加时间戳防止浏览器缓存导致读不到最新数据
                const res = await fetch(`${API_URL}/latest?_t=${Date.now()}`, {
                    headers: { 'X-Master-Key': '$2a$10$w8W7h0F5qXN...' }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.record && Array.isArray(data.record.users)) {
                        // 同时更新到本地缓存一份作为备份
                        localStorage.setItem('cyber_cloud_users', JSON.stringify(data.record.users));
                        return data.record.users;
                    }
                }
            } catch (e) {
                console.log("云端读取失败，降级读取本地");
            }
            // 失败时从本地读取
            const local = localStorage.getItem('cyber_cloud_users');
            return local ? JSON.parse(local) : [];
        }

        async function saveUsers(users) {
            // 立即更新本地
            localStorage.setItem('cyber_cloud_users', JSON.stringify(users));
            
            try {
                // 实时双向写入云端
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': '$2a$10$w8W7h0F5qXN...'
                    },
                    body: JSON.stringify({ users: users })
                });
            } catch (e) {
                console.log("云端写入网络异常，已保持本地缓存");
            }
        }

        let isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const loginCont = document.getElementById('loginFormContainer');
            const regCont = document.getElementById('registerFormContainer');
            const subTitle = document.getElementById('authSubtitle');
            const toggleBtn = document.getElementById('toggleAuthModeBtn');

            if (isRegisterMode) {
                loginCont.classList.add('hidden');
                regCont.classList.remove('hidden');
                subTitle.innerText = "新用户注册 (多端云同步)";
                toggleBtn.innerText = "← 返回登录";
            } else {
                regCont.classList.add('hidden');
                loginCont.classList.remove('hidden');
                subTitle.innerText = "多端云端数据实时互通";
                toggleBtn.innerText = "注册新账号 →";
            }
        }

        async function handleRegister() {
            const qq = document.getElementById('regQQ').value.trim();
            const p1 = document.getElementById('regPass1').value;
            const p2 = document.getElementById('regPass2').value;

            if (!qq || !p1 || !p2) {
                alert("所有字段不能为空！");
                return;
            }

            // 先从云端拉取最新数据校验重名
            let users = await getUsers();
            if (users.find(u => u.qq === qq)) {
                alert("❌ 该用户名已存在，请换一个名字！");
                document.getElementById('regQQ').focus();
                return;
            }

            if (p1 !== p2) {
                alert("两次输入的密码不一致！");
                return;
            }

            users.push({
                qq: qq,
                pass1: p1,
                regTime: new Date().toLocaleString()
            });

            await saveUsers(users);
            alert("注册成功！数据已成功推送到云端，平板和电脑现在可以互通登录了。");
            toggleAuthMode();
        }

        async function handleLogin() {
            const qq = document.getElementById('loginQQ').value.trim();
            const p1 = document.getElementById('loginPass1').value;

            // 登录前强制从云端读取最新账号列表
            let users = await getUsers();
            const user = users.find(u => u.qq === qq && u.pass1 === p1);

            if (!user) {
                alert("登录失败：账号不存在或密码错误！\n（提示：请确认平板和电脑使用的是同一个网页，且注册时网络正常）");
                return;
            }

            sessionStorage.setItem('current_user', qq);
            enterMainApp(qq);
        }

        function enterMainApp(qq) {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('mainMenuView').classList.remove('hidden');
            document.getElementById('userInfoDisplay').classList.remove('hidden');
            document.getElementById('currentQQDisplay').innerText = qq;
        }

        function logout() {
            sessionStorage.removeItem('current_user');
            location.reload();
        }

        async function deleteAccount() {
            const currentQQ = sessionStorage.getItem('current_user');
            if (!currentQQ) return;

            if (confirm(`⚠️ 警告：您确定要永久注销账户 [${currentQQ}] 吗？`)) {
                let users = await getUsers();
                users = users.filter(u => u.qq !== currentQQ);
                await saveUsers(users);
                sessionStorage.removeItem('current_user');
                alert("账户已从云端永久注销。");
                location.reload();
            }
        }

        async function exportToExcel() {
            let users = await getUsers();
            if (users.length === 0) {
                alert("当前没有注册用户数据！");
                return;
            }

            let csvContent = "\uFEFFQQ号/用户名,密码,注册时间\n";
            users.forEach(u => {
                csvContent += `"${u.qq}","${u.pass1}","${u.regTime}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CyberUsers_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function switchView(viewId) {
            document.getElementById('mainMenuView').classList.add('hidden');
            document.getElementById('sendView').classList.add('hidden');
            document.getElementById('receiveView').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function goToChat() {
            window.location.href = 'chat.html';
        }

        // P2P 传档逻辑
        let peer = null;
        let localRoomCode = '';
        let receivedFileBlob = null;
        let receivedFileName = "downloaded_file.bin";

        function generateRoomCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function initSender() {
            localRoomCode = generateRoomCode();
            document.getElementById('roomCodeDisplay').innerText = localRoomCode;
            document.getElementById('sendProgressContainer').classList.remove('hidden');
            document.getElementById('sendStatusText').innerText = "正在初始化 P2P 节点...";
            document.getElementById('sendProgressBar').style.width = '0%';
            document.getElementById('sendPercentage').innerText = '0%';

            if (peer) peer.destroy();
            peer = new Peer(localRoomCode);

            peer.on('open', (id) => {
                document.getElementById('sendStatusText').innerText = "就绪！等待接收端输入码 [" + id + "] 接入...";
            });

            peer.on('connection', (conn) => {
                document.getElementById('sendStatusText').innerText = "接收端已连接，准备发送文件...";
                
                conn.on('data', (data) => {
                    if (data === 'REQUEST_FILE') {
                        const fileInput = document.getElementById('fileInput');
                        if (fileInput.files.length === 0) {
                            alert("请先在传送端选择一个要发送的文件！");
                            conn.send({ type: 'ERROR', message: '发送方未选择文件' });
                            return;
                        }
                        const file = fileInput.files[0];
                        
                        conn.send({
                            type: 'META',
                            name: file.name,
                            size: file.size,
                            fileType: file.type
                        });

                        document.getElementById('sendStatusText').innerText = `正在向接收方传输: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)...`;

                        const CHUNK_SIZE = 16384;
                        const reader = new FileReader();
                        let offset = 0;

                        reader.onload = (e) => {
                            conn.send({
                                type: 'CHUNK',
                                buffer: e.target.result,
                                offset: offset
                            });
                            offset += e.target.result.byteLength;

                            const percent = Math.round((offset / file.size) * 100);
                            document.getElementById('sendProgressBar').style.width = percent + '%';
                            document.getElementById('sendPercentage').innerText = percent + '%';

                            if (offset < file.size) {
                                readNextChunk();
                            } else {
                                document.getElementById('sendStatusText').innerText = `✅ 传输成功！文件已完整送达接收方。`;
                            }
                        };

                        function readNextChunk() {
                            const slice = file.slice(offset, offset + CHUNK_SIZE);
                            reader.readAsArrayBuffer(slice);
                        }

                        readNextChunk();
                    }
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    initSender();
                } else {
                    document.getElementById('sendStatusText').innerText = "连接错误: " + err.type;
                }
            });
        }

        function connectAndReceive() {
            const code = document.getElementById('inputRoomCode').value.trim();
            if (code.length !== 6) {
                alert("请输入正确的 6 位连接码！");
                return;
            }

            document.getElementById('receiveProgressContainer').classList.remove('hidden');
            document.getElementById('receiveStatusText').innerText = "正在连接发送方...";
            document.getElementById('receiveProgressBar').style.width = '0%';
            document.getElementById('receivePercentage').innerText = '0%';
            document.getElementById('downloadLinkContainer').classList.add('hidden');

            const clientPeer = new Peer();

            clientPeer.on('open', () => {
                const conn = clientPeer.connect(code);

                conn.on('open', () => {
                    document.getElementById('receiveStatusText').innerText = "连接成功，请求文件中...";
                    conn.send('REQUEST_FILE');
                });

                let fileBuffer = [];
                let receivedSize = 0;
                let fileMeta = null;

                conn.on('data', (data) => {
                    if (data.type === 'META') {
                        fileMeta = data;
                        receivedFileName = data.name;
                        document.getElementById('receiveStatusText').innerText = `开始接收: ${fileMeta.name} (${(fileMeta.size/1024/1024).toFixed(2)} MB)...`;
                    } else if (data.type === 'CHUNK') {
                        fileBuffer.push(data.buffer);
                        receivedSize += data.buffer.byteLength;

                        const percent = Math.round((receivedSize / fileMeta.size) * 100);
                        document.getElementById('receiveProgressBar').style.width = percent + '%';
                        document.getElementById('receivePercentage').innerText = percent + '%';

                        if (receivedSize >= fileMeta.size) {
                            receivedFileBlob = new Blob(fileBuffer, { type: fileMeta.fileType || 'application/octet-stream' });
                            document.getElementById('receiveStatusText').innerText = `✅ 传输成功！文件接收完毕，请点击下方按钮另存为。`;
                            document.getElementById('downloadLinkContainer').classList.remove('hidden');
                        }
                    } else if (data.type === 'ERROR') {
                        alert("错误: " + data.message);
                        document.getElementById('receiveStatusText').innerText = "传输失败: " + data.message;
                    }
                });

                conn.on('error', (err) => {
                    alert("连接断开或发送方不在线！");
                    document.getElementById('receiveStatusText').innerText = "连接失败，请检查 6 位码是否正确。";
                });
            });
        }

        async function saveFileToFolder() {
            if (!receivedFileBlob) {
                alert("没有可保存的文件！");
                return;
            }

            if ('showSaveFilePicker' in window) {
                try {
                    const opts = {
                        suggestedName: receivedFileName,
                        types: [{
                            description: '所有文件',
                            accept: { '*/*': ['.exe', '.zip', '.txt', '.png', '.jpg', '.pdf', '.rar', '.7z'] }
                        }],
                    };
                    const handle = await window.showSaveFilePicker(opts);
                    const writable = await handle.createWritable();
                    await writable.write(receivedFileBlob);
                    await writable.close();
                    alert("文件已成功保存到您指定的文件夹！");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(receivedFileBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = receivedFileName;
            a.click();
            URL.revokeObjectURL(url);
            alert("文件已保存至您的默认下载目录！");
        }

        window.onload = async function() {
            const activeUser = sessionStorage.getItem('current_user');
            if (activeUser) {
                enterMainApp(activeUser);
            }
        };
    </script>
</body>
</html>
