<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAdmin - 至高管理员终端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace, sans-serif; background-color: #030712; color: #ff3366; overflow-x: hidden; }
        .glow-box-red { box-shadow: 0 0 20px rgba(255, 51, 102, 0.2); border: 1px solid rgba(255, 51, 102, 0.4); }
        .glow-text-red { text-shadow: 0 0 10px rgba(255, 51, 102, 0.7); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #ff3366; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- 背景网格 -->
    <div class="fixed inset-0 pointer-events-none opacity-10 bg-[linear-gradient(to_right,#ff3366_1px,transparent_1px),linear-gradient(to_bottom,#ff3366_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

    <!-- 自定义弹窗 -->
    <div id="cyberModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="glow-box-red bg-neutral-950 p-6 rounded-2xl max-w-sm w-full mx-4 text-center space-y-4">
            <div class="text-xs uppercase tracking-widest text-red-500">ADMIN_PANEL // 管理员特权提示</div>
            <div id="modalMessage" class="text-red-300 text-sm leading-relaxed py-2">提示内容</div>
            <button onclick="closeCyberModal()" class="w-full bg-red-950 hover:bg-red-900 border border-red-500 text-red-300 font-bold py-2.5 rounded-lg transition tracking-widest text-xs">
                关 闭 窗 口
            </button>
        </div>
    </div>

    <!-- 顶栏 -->
    <header class="w-full max-w-4xl flex justify-between items-center text-xs tracking-widest text-red-500/80 py-4 z-10 border-b border-red-950 mb-6">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span>GOD_MODE // 最高权限控制中心</span>
        </div>
        <div>
            [管理员: <span id="adminUserDisplay" class="text-red-400 font-bold"></span>]
            <button onclick="window.location.href='index.html'" class="ml-4 underline hover:text-red-300">返回主页</button>
        </div>
    </header>

    <!-- 主面板 -->
    <main class="w-full max-w-4xl z-10 space-y-6">
        <div class="glow-box-red bg-black/85 backdrop-blur-md p-6 rounded-2xl space-y-4">
            <h1 class="text-xl font-bold glow-text-red text-red-400">所有注册用户数据库管理</h1>
            <p class="text-xs text-red-600">在此你可以实时监控、修改任意用户的密码，或直接删除其账号。</p>
            
            <div class="overflow-x-auto pt-2">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-red-950 text-red-500">
                            <th class="p-3">行号</th>
                            <th class="p-3">QQ / 用户名</th>
                            <th class="p-3">当前主密码</th>
                            <th class="p-3">注册时间</th>
                            <th class="p-3">当前状态</th>
                            <th class="p-3 text-right">至高特权操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" class="text-center p-6 text-red-600">正在链接 Google 云端核心...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2PFciwbWNzKqH6VPe8Yij7vGR4t6dsQRHSM31fbN4D9GCyWZjTRTAgDxe4sIec-fkeQ/exec";
        
        // 你可以把管理员的名字设为你的专属 QQ，比如 "admin" 或你自己注册的号
        const ADMIN_QQ = "admin"; 

        window.onload = function() {
            const currentUser = sessionStorage.getItem('current_user');
            if (currentUser !== ADMIN_QQ) {
                showCyberAlert("❌ 权限拒绝：你不是至高管理员账号！");
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            }
            document.getElementById('adminUserDisplay').innerText = currentUser;
            loadAllUsers();
        };

        function showCyberAlert(msg) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('cyberModal').classList.remove('hidden');
        }
        function closeCyberModal() { document.getElementById('cyberModal').classList.add('hidden'); }

        function loadAllUsers() {
            const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                renderTable(data.users || []);
            };

            const script = document.createElement('script');
            script.src = `${GOOGLE_SCRIPT_URL}?callback=${callbackName}&_t=${Date.now()}`;
            script.onerror = function() {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                document.getElementById('userTableBody').innerHTML = '<tr><td colspan="6" class="text-center p-6 text-red-500">加载用户数据失败</td></tr>';
            };
            document.body.appendChild(script);
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center p-6 text-red-600">暂无注册用户</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-red-950/60 hover:bg-red-950/10 transition';
                tr.innerHTML = `
                    <td class="p-3 text-red-500">#${u.rowIndex}</td>
                    <td class="p-3 text-red-300 font-bold">${u.qq}</td>
                    <td class="p-3">
                        <input type="text" id="pass_${u.rowIndex}" value="${u.pass1}" class="bg-neutral-900 border border-red-900 text-red-200 px-2 py-1 rounded w-32 focus:outline-none focus:border-red-500">
                    </td>
                    <td class="p-3 text-red-600">${u.regTime}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] ${u.status === 'ONLINE' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-neutral-900 text-red-600'}">${u.status}</span></td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="modifyUser(${u.rowIndex})" class="bg-red-950 hover:bg-red-900 border border-red-500 text-red-300 px-3 py-1 rounded transition text-xs">修改密码</button>
                        <button onclick="deleteUser(${u.rowIndex}, '${u.qq}')" class="bg-red-900/40 hover:bg-red-800 border border-red-600 text-red-200 px-3 py-1 rounded transition text-xs">删除账号</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 修改他人密码
        async function modifyUser(rowIndex) {
            const newPass = document.getElementById(`pass_${rowIndex}`).value.trim();
            if (!newPass) return showCyberAlert("密码不能为空！");
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "adminUpdateUser", rowIndex: rowIndex, newPass: newPass })
                });
                showCyberAlert("✅ 成功：该用户的密码已被强制修改！");
                setTimeout(loadAllUsers, 1200);
            } catch (e) {
                showCyberAlert("❌ 操作失败！");
            }
        }

        // 删除他人账号
        async function deleteUser(rowIndex, qq) {
            if (!confirm(`⚠️ 警告：确定要彻底抹除用户 [${qq}] 吗？此操作不可逆！`)) return;

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "adminDeleteUser", rowIndex: rowIndex })
                });
                showCyberAlert(`✅ 成功：用户 [${qq}] 已被从云端数据库中抹除！`);
                setTimeout(loadAllUsers, 1200);
            } catch (e) {
                showCyberAlert("❌ 删除失败！");
            }
        }
    </script>
</body>
</html>
