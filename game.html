<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTower - 鸽子大炮对决终端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace, sans-serif; background-color: #030712; color: #00ff66; overflow: hidden; }
        .glow-box { box-shadow: 0 0 25px rgba(0, 255, 102, 0.2); border: 1px solid rgba(0, 255, 102, 0.4); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 255, 102, 0.7); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 背景网格 -->
    <div class="fixed inset-0 pointer-events-none opacity-10 bg-[linear-gradient(to_right,#00ff66_1px,transparent_1px),linear-gradient(to_bottom,#00ff66_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

    <!-- 弹窗 -->
    <div id="cyberModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
        <div class="glow-box bg-neutral-950 p-6 rounded-2xl max-w-sm w-full mx-4 text-center space-y-4">
            <div id="modalTitle" class="text-xs uppercase tracking-widest text-emerald-500">战局提示</div>
            <div id="modalMessage" class="text-emerald-300 text-sm leading-relaxed py-2">内容</div>
            <button onclick="closeModal()" class="w-full bg-emerald-950 hover:bg-emerald-900 border border-emerald-500 text-emerald-300 font-bold py-2.5 rounded-lg transition tracking-widest text-xs">确 定</button>
        </div>
    </div>

    <!-- 主容器 -->
    <main class="w-full max-w-3xl z-10 space-y-4">
        
        <!-- 顶栏 -->
        <div class="flex justify-between items-center text-xs tracking-widest border-b border-emerald-950 pb-2">
            <span class="text-emerald-500">⚔️ 鸽子大炮对决战场 // 绝对稳定版</span>
            <button onclick="window.location.href='index.html'" class="underline hover:text-emerald-300">退出返回</button>
        </div>

        <!-- 1. 联机大厅配置 -->
        <div id="lobbyView" class="glow-box bg-black/90 p-6 rounded-2xl space-y-4 text-center">
            <h1 class="text-xl font-bold glow-text text-emerald-400">P2P 炮塔攻防战</h1>
            <p class="text-xs text-emerald-600">基地 HP: 2000 | 炮弹每2秒发射(伤50) | 士兵HP: 100(两发炮弹击杀) | 士兵攻击基地(伤25)</p>
            
            <div class="grid grid-cols-2 gap-4 pt-4">
                <button onclick="hostGame()" class="p-4 bg-emerald-950/40 hover:bg-emerald-950 border border-emerald-500 rounded-xl font-bold text-emerald-300 text-sm">
                    🛡️ 创建对战房
                </button>
                <div class="space-y-2">
                    <input type="text" id="roomCodeInput" maxlength="6" placeholder="输入6位房号" class="w-full bg-neutral-900 border border-emerald-900 text-emerald-300 text-center px-3 py-2 rounded-lg text-sm tracking-widest">
                    <button onclick="joinGame()" class="w-full bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-300 font-bold py-2 rounded-lg text-sm">
                        🔗 加入房间
                    </button>
                </div>
            </div>
            <div id="roomCodeDisplay" class="text-xs text-amber-400 pt-2"></div>
        </div>

        <!-- 2. 游戏战场视图 -->
        <div id="gameView" class="hidden glow-box bg-black/95 p-4 rounded-2xl space-y-3">
            <!-- 状态面板 -->
            <div class="flex justify-between items-center bg-neutral-900/80 border border-emerald-950 px-4 py-2 rounded-xl text-xs">
                <div>我的基地 HP: <span id="myHp" class="text-emerald-400 font-bold text-sm">2000</span></div>
                <div id="battleStatus" class="text-amber-400 font-bold animate-pulse">战斗中...</div>
                <div>敌方基地 HP: <span id="enemyHp" class="text-red-400 font-bold text-sm">2000</span></div>
            </div>

            <!-- 战斗画布 -->
            <div class="relative border border-emerald-900 rounded-xl overflow-hidden bg-neutral-950">
                <canvas id="gameCanvas" width="700" height="300" class="w-full block"></canvas>
            </div>

            <!-- 操作控制区 -->
            <div class="grid grid-cols-2 gap-4 pt-1">
                <button onclick="sendCannonBall()" class="bg-emerald-950 hover:bg-emerald-900 border border-emerald-500 text-emerald-300 font-bold py-3 rounded-xl text-xs tracking-wider">
                    🕊️ 手动发射炮弹 (鸽子大炮)
                </button>
                <button onclick="spawnSoldier()" class="bg-indigo-950 hover:bg-indigo-900 border border-indigo-500 text-indigo-300 font-bold py-3 rounded-xl text-xs tracking-wider">
                    🛡️ 派遣士兵 (推进进攻)
                </button>
            </div>
        </div>

    </main>

    <script>
        let peer = null;
        let conn = null;
        
        let myHp = 2000;
        let enemyHp = 2000;
        let bullets = [];   
        let soldiers = [];  
        let gameRunning = false;
        let lastAutoShot = 0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function showModal(msg, title = "战局提示") {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('cyberModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('cyberModal').classList.add('hidden'); }

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function hostGame() {
            const code = generateCode();
            document.getElementById('roomCodeDisplay').innerText = "您的房间码: " + code + " (等待对手加入...)";
            
            if (peer) peer.destroy();
            peer = new Peer(code);
            peer.on('connection', (incoming) => {
                conn = incoming;
                setupConnection();
                startGameLoop();
                showModal("对手已连接，战斗开始！", "游戏开始");
            });
        }

        function joinGame() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (code.length !== 6) return showModal("请输入6位有效房号！");

            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                startGameLoop();
                showModal("成功加入房间，战斗开始！", "游戏开始");
            });
        }

        function setupConnection() {
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');

            conn.on('data', (data) => {
                if (!gameRunning) return;

                if (data.type === 'ACTION') {
                    if (data.action === 'CANNON') {
                        // 对方发射炮弹，在我方画布右侧生成并向左飞
                        bullets.push({ x: canvas.width - 50, y: 150, vx: -4, team: 'enemy' });
                    } else if (data.action === 'SOLDIER') {
                        // 对方派遣士兵，在我方画布右侧生成并向左走
                        soldiers.push({ x: canvas.width - 50, y: 200, hp: 100, team: 'enemy' });
                    }
                } else if (data.type === 'ATTACK_ENEMY_BASE') {
                    // 对方发来消息：我的士兵成功打到了他的基地（也就是我方视角的敌方基地扣血）
                    enemyHp -= data.damage;
                    if (enemyHp < 0) enemyHp = 0;
                    document.getElementById('enemyHp').innerText = enemyHp;
                    checkGameOver();
                } else if (data.type === 'GAME_OVER') {
                    gameRunning = false;
                    showModal("❌ 你输了！基地已被摧毁。", "胜负已分");
                }
            });
        }

        function sendAction(actionType) {
            if (conn && conn.open) {
                conn.send({ type: 'ACTION', action: actionType });
            }
        }

        function sendCannonBall() {
            if (!gameRunning) return;
            // 我方发射炮弹，在左侧生成并向右飞
            bullets.push({ x: 50, y: 150, vx: 4, team: 'my' });
            sendAction('CANNON');
        }

        function spawnSoldier() {
            if (!gameRunning) return;
            // 我方派遣士兵，在左侧生成并向右走
            soldiers.push({ x: 50, y: 200, hp: 100, team: 'my' });
            sendAction('SOLDIER');
        }

        function startGameLoop() {
            gameRunning = true;
            myHp = 2000;
            enemyHp = 2000;
            bullets = [];
            soldiers = [];
            document.getElementById('myHp').innerText = myHp;
            document.getElementById('enemyHp').innerText = enemyHp;

            function loop(timestamp) {
                if (!gameRunning) return;

                if (timestamp - lastAutoShot > 2000) {
                    sendCannonBall();
                    lastAutoShot = timestamp;
                }

                updateGame();
                renderGame();
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function updateGame() {
            if (!gameRunning) return;

            // 1. 更新炮弹逻辑
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;

                // 炮弹碰撞敌对方士兵
                for (let j = soldiers.length - 1; j >= 0; j--) {
                    let s = soldiers[j];
                    if (b.team !== s.team && Math.abs(b.x - s.x) < 20) {
                        s.hp -= 50; // 一发炮弹伤害 50
                        bullets.splice(i, 1); // 炮弹消失
                        if (s.hp <= 0) soldiers.splice(j, 1); // 士兵血量100，两发击杀
                        break;
                    }
                }

                // 越界清除
                if (b.x < 0 || b.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // 2. 更新士兵移动与基地攻击逻辑
            for (let i = soldiers.length - 1; i >= 0; i--) {
                let s = soldiers[i];
                if (s.team === 'my') {
                    s.x += 1;
                    // 我的士兵走到右侧边缘 = 攻击了对方基地（伤25）
                    if (s.x >= canvas.width - 40) {
                        enemyHp -= 25;
                        if (enemyHp < 0) enemyHp = 0;
                        document.getElementById('enemyHp').innerText = enemyHp;
                        
                        // 通知对方基地被攻击了
                        if (conn && conn.open) {
                            conn.send({ type: 'ATTACK_ENEMY_BASE', damage: 25 });
                        }
                        
                        soldiers.splice(i, 1); // 士兵完成攻击后消失
                        checkGameOver();
                    }
                } else {
                    s.x -= 1;
                    // 敌方士兵走到左侧边缘 = 攻击了我方基地（伤25）
                    if (s.x <= 40) {
                        myHp -= 25;
                        if (myHp < 0) myHp = 0;
                        document.getElementById('myHp').innerText = myHp;
                        
                        soldiers.splice(i, 1); // 士兵完成攻击后消失
                        checkGameOver();
                    }
                }
            }
        }

        function checkGameOver() {
            if (!gameRunning) return;
            if (myHp <= 0) {
                gameRunning = false;
                if (conn && conn.open) conn.send({ type: 'GAME_OVER', winner: 'enemy' });
                showModal("❌ 你输了！基地已被摧毁。", "胜负已分");
            } else if (enemyHp <= 0) {
                gameRunning = false;
                if (conn && conn.open) conn.send({ type: 'GAME_OVER', winner: 'me' });
                showModal("🏆 胜利！你成功摧毁了对方的基地！", "胜负已分");
            }
        }

        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 我方基地 (左侧)
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(20, 100, 30, 120);

            // 敌方基地 (右侧)
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(canvas.width - 50, 100, 30, 120);

            // 中线
            ctx.strokeStyle = 'rgba(0,255,102,0.2)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // 渲染炮弹
            bullets.forEach(b => {
                ctx.fillStyle = b.team === 'my' ? '#00ff66' : '#ff3366';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            // 渲染士兵
            soldiers.forEach(s => {
                ctx.fillStyle = s.team === 'my' ? '#00ff66' : '#ff3366';
                ctx.fillRect(s.x - 10, s.y - 15, 20, 25);
            });
        }
    </script>
</body>
</html>
